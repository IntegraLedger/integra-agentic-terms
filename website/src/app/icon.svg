<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Integra Agentic Terms: a document divided by a stepped cut — the indenture, whose
       teeth had to line up or the half in your hand was a forgery. Filled rather than
       stroked so it reads at 16px on any tab colour. Same geometry as MarkIcon.tsx. -->
  <rect x="3" y="3" width="42" height="42" rx="9" fill="#2563d9"/>
  <path d="M 3 24 h 10.5 v -5.5 h 10.5 v 11 h 10.5 v -5.5 H 45"
        fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round"/>
</svg>
