[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "integraledger-terms"
version = "0.2.0"
description = "Buyer gate: compare the ATR hash with the served bytes, and build the payment with that hash, before signing."
readme = "README.md"
license = "Apache-2.0"
keywords = ["agentic-commerce", "ai-agents", "legal-context-protocol", "lcp", "atr", "x402", "mpp", "payments", "sha256", "buyer"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<0.29", "cryptography==50.0.1"]

[project.urls]
Homepage = "https://github.com/IntegraLedger/integra-agentic-terms/tree/main/agentic-terms-py#readme"
Repository = "https://github.com/IntegraLedger/integra-agentic-terms"
Issues = "https://github.com/IntegraLedger/integra-agentic-terms/issues"

[dependency-groups]
dev = ["pytest==9.1.1", "mypy==2.3.1", "eth-account==0.14.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/integraledger_terms"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
