packages:
  - "packages/*"
# @swc/core's build script is deliberately NOT run (decision: false): its native parser binding is the
# prebuilt @swc/core-<platform> optional dependency, and dependency-cruiser's swc parser needs only that
# binding. Keeping arbitrary postinstall execution off is the supply-chain posture for a repository that
# publishes two public packages; the ignoredBuiltDependencies list documents the deliberate skip.
#
# ⛔ TWO KEYS, AND THEY ARE NOT REDUNDANT — do not consolidate them. `integra-protocol` removed `allowBuilds`
# on 2026-08-12 reasoning it duplicated the list below; CI failed on the next push with
# ERR_PNPM_IGNORED_BUILDS. They do different jobs:
#
#   allowBuilds              the DECISION. pnpm 11 refuses an install that silently skips a build script
#                            unless the choice is recorded. Without it `pnpm install --frozen-lockfile` EXITS 1.
#   ignoredBuiltDependencies the RECORD, for a reader — which packages are skipped, legibly.
#
# ⚠️ A warm `node_modules` does not re-run the decision, so `pnpm verify` stays green locally while a cold
# install fails. Test a change here with a fresh clone, never with an existing tree.
allowBuilds:
  '@swc/core': false
ignoredBuiltDependencies:
  - "@swc/core"

catalog:
  # ⛔ MUST equal the protocol repo's catalog pin, and this is the one entry here that carries a
  # cross-repo obligation. `@integraledger/lcp-discovery` declares `zod` in its own `dependencies`, and
  # THIS package is published too — so a divergence does not stay here, it ships, and lands as two copies
  # in every tree that installs both, and at least one downstream consumer does.
  #
  # ⚠️ Nothing in the compiler will catch it: `zod` does not appear in this package's public `.d.ts`
  # surface. What breaks is runtime identity — a schema built by one copy fails `instanceof` against the
  # other, so every "is this one of mine" branch quietly answers no. `check:shared-pins` is the only thing
  # that sees it, which is why the pin and this sentence move together.
  zod: "4.5.4" # trust boundaries only — never inside verification logic
  vitest: "5.0.0" # 5 changed the full-test-name separator to " > "; see patchedDependencies below
  "@types/node": "24.13.3" # FLOOR-pinned to engines (>=24.0.0): types never exceed the oldest supported runtime
  # The MCP v2 SDK, split from v1's monolithic @modelcontextprotocol/sdk. 2.0.0 is the STABLE line
  # implementing the 2026-07-28 MCP revision.
  "@modelcontextprotocol/server": "2.0.0" # lcp-mcp-server's tool surface
  "@modelcontextprotocol/client": "2.0.0" # its tests' real client, over the SDK's in-memory transport

minimumReleaseAge: 1440 # supply-chain default: 24h quarantine on new third-party releases
minimumReleaseAgeExclude:
  - "@integraledger/*" # first-party packages are trusted; quarantining them makes a fresh publish unconsumable for 24h

# Transitive-CVE overrides. Each has a resolution path in THIS
# graph (dev tooling: stryker, vitest/vite). Reviewed on every audit run; `pnpm audit` in verify is the
# gate that decides whether an entry is still needed or a new one is.
overrides:
  # GHSA-x5fp-wj9c-mxmx (moderate) array-limit bypass via bracket-key comma parsing, GHSA-4mjr-xmp4-gh2g
  # (moderate) DoS via attacker-controlled isBuffer — both 2026-09-02, both fixed in 6.16.0 (published
  # 08-29, clear of the quarantine). Supersedes the 6.15.2 floor for the comma-format stringify DoS.
  # Dev-only, via @stryker-mutator/core > typed-rest-client — no consumer path.
  qs: ">=6.16.0"
  # GHSA-rgw5-rvv9-x895 (high): unbounded intermediate arrays, bypassing the CVE-2026-14257 mitigation.
  # Dev-only, via @stryker-mutator/core > minimatch — no consumer path.
  brace-expansion: ">=5.0.9"
  # GHSA-fxqj-rqcc-2cmp (moderate): incomplete fix of GHSA-6g55-p6wh-862q — attacker-controlled
  # sourceMappingURL still reads arbitrary .map files when `from` is unset. Dev-only, via vite under vitest.
  postcss: ">=8.5.23"
  # GHSA-7p8r-x3mc-p8w7 (high): host confusion via a backslash authority introducer. Dev-only,
  # via @stryker-mutator/core > ajv — no consumer path.
  # FOUR more on 2026-09-02 — GHSA-5jgf-p345-68v8, GHSA-jqff-g426-hqxp (host confusion via skipped IDN /
  # percent-encoded scheme), GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf (SSRF) — all fixed in 4.1.3
  # (published 08-23, clear of the quarantine). Supersedes the 3.1.5 floor. Still dev-only via ajv.
  fast-uri: ">=4.1.3"
  # nanoid <3.3.18 — TWO advisories, one entry. GHSA-2v37-7h3g-55p8 (high): a custom generator loops
  # indefinitely when size is zero, fixed in 3.3.18; it supersedes the predictable-output advisory that
  # first added this entry, fixed in 3.3.17. Dev-only, via vitest > vite > postcss. The floor states 3.3.18
  # rather than relying on resolution: `>=3.3.17` happens to install 3.3.18 today because that is the newest
  # match, but a range that still admits a known-vulnerable version is safe by accident rather than by
  # decision, and a regenerated lockfile could quietly take 3.3.17 back. Bounded `<4` deliberately: nanoid
  # went ESM-only at 4.0.0 and postcss is CJS, so an unbounded `>=3.3.18` resolves to 6.x and satisfies the
  # auditor by breaking the dependency.
  nanoid: ">=3.3.18 <4"

# ⛔⛔ A PATCHED TEST TOOL, AND THE ALTERNATIVE WAS A MUTATION GATE THAT LIES.
#
# `@stryker-mutator/vitest-runner` builds its per-mutant test filter by joining a test's suite names and
# its own name with a SINGLE SPACE (`collectTestName`, `nameParts.join(' ')`), turns that into a regex, and
# hands it to vitest as `testNamePattern`. vitest 5 composes the name it MATCHES that pattern against with
# `" > "` instead (`createTaskName(names, separator = " > ")`, matched against `t.fullTestName`). The two
# spellings are not the same string, so the pattern matches nothing.
#
# ⛔ AND THE FAILURE IS SILENT IN THE DANGEROUS DIRECTION. vitest does not error on a pattern that matches
# nothing — it SKIPS every test and exits 0. Stryker sees a run in which nothing failed and records the
# mutant SURVIVED, so a package scores against a suite that executed no tests at all.
#
# ⭐⭐ MEASURED HERE, NOT INHERITED — `packages/seller-mcp`, vitest 5.0.0, this tree, 2026-09-13. The same
# package measured twice under the same lock, patched and unpatched, is the ONLY evidence that the filter
# is live. A passing score is not that evidence: unpatched, this package's score was identical to the one
# recorded on vitest 4 — what proves the patch is that REMOVING it makes the score collapse.
#
#     with this patch:     93.98  —  78 killed,  5 survived   (83 mutants)
#     without this patch:   4.82  —   4 killed, 79 survived   (83 mutants — same population)
#
# ⭐ And the collapse partitions EXACTLY on `static`: all 4 mutants that still die are the package's 4
# static ones, which are the only mutants Stryker runs unfiltered, and all 79 non-static ones survive.
# Nothing crosses the line. That is protocol's `5420510` signature reproduced.
#
# ⚠️ AND IT WOULD HAVE GONE THE OTHER WAY SOMEWHERE ELSE. A package whose ratchet sits below the score its
# static mutants alone produce would have stayed GREEN over a suite that ran no tests. This gate's whole
# purpose is to be the thing that cannot quietly become vacuous, so a red is the good outcome and the
# reason this is patched rather than waited out.
#
# ⛔ IT IS NOT FIXABLE FROM CONFIGURATION. vitest exposes the separator as a default parameter, not as an
# option, and protocol measured `coverageAnalysis` at `perTest`, `all` and `off` with an identical result.
#
# ⭐ FOUR SITES, NOT ONE. `collectTestName` is duplicated in the package — `test-helpers` builds the ids
# the runner reports, `stryker-setup` builds the ids the in-test-environment hook reports, and both ship as
# `dist/` JavaScript and as `src/` TypeScript. The filter is built from the ids the SETUP hook produced, so
# patching the helper alone leaves the two halves spelling the same test differently. All four move together.
#
# ⛔ THE REMOVAL CONDITION, because a patch nobody retires is a fork. `10.0.0` is the newest release and it
# predates vitest 5 by three weeks (runner 2026-08-14, vitest 5.0.0 2026-09-03) — there is no published
# version that supports vitest 5. When one exists, DELETE this patch and this block rather than rebasing
# it: pnpm refuses a patch whose target version moved, so the bump cannot silently carry it forward.
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
