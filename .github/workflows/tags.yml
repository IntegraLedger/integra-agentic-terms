name: tags

# Reconcile git tags against what is actually published, on a schedule and on demand.
#
# ⛔⛔ WHY THIS IS A WORKFLOW AND NOT A STEP IN THE RELEASE. Tagging used to happen only inside
# `approve-staged.mjs`, so it happened only when a maintainer approved by running that script. Approving
# in the npm web UI is the same 2FA proof-of-presence and is entirely legitimate — and it never reaches
# the script, so the repository goes untagged with nothing reporting it. `0.11.0` shipped that way and
# produced no tags; the sibling protocol repository lost five consecutive releases to the same cause,
# which looked like a bug in the tagging code for a long time and was not. The code was never reached.
#
# ⭐ A step that runs on only one of several legitimate paths is not a step, it is a coincidence. This
# asks the registry and each version's own provenance instead, so it is correct after a script approval,
# a web approval, or a publish nobody remembers making.
#
# The reconciler needs NO npm auth — provenance and the packument are public reads.

on:
  schedule:
    # Daily, offset off the hour. A release can be approved at any time and from anywhere, so the gap
    # between "published" and "tagged" should be hours rather than until someone notices.
    - cron: "23 7 * * *"
  workflow_dispatch:
  # Also after a release is staged: the approval that follows may never touch the script, and running
  # here costs one job against the chance of the tags being written the same day they are earned.
  workflow_run:
    workflows: [release]
    types: [completed]

# ⚠️ LEAST PRIVILEGE IS PER-JOB. A top-level block would grant `contents: write` to every job added
# later; this one job needs it to push tags and nothing else does.
permissions: {}

concurrency:
  group: tags
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags — the only write this workflow performs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are written against the commit each version's provenance names, which is usually NOT the
          # tip. A shallow clone would not contain it and the reconciler would refuse rather than guess.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Reconcile tags against the registry
        shell: bash # `run:` defaults to `bash -e` WITHOUT pipefail; naming the shell is the house rule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/reconcile-tags.mjs --write
