name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: A DCO sign-off and no agent trailer on every commit in the checked commit's history
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "the checkout is shallow: the step reads every commit reachable from $GITHUB_SHA, and a shallow history holds only some"; exit 1
          fi
          unsigned=$(git log --format='%H %(trailers:key=Signed-off-by,valueonly,separator=%x2C)' "$GITHUB_SHA" | awk 'NF<2')
          agent=$(git rev-list "$GITHUB_SHA" | while read -r c; do
            git show -s --format=%B "$c" | grep -Ei 'co-authored-by|generated with|claude|anthropic' | sed "s/^/${c:0:12} /" || true
          done)
          [ -z "$unsigned" ] || printf 'commits without a Signed-off-by: trailer:\n%s\n' "$unsigned"
          [ -z "$agent" ] || printf 'commit messages naming an agent:\n%s\n' "$agent"
          if [ -n "$unsigned" ] || [ -n "$agent" ]; then exit 1; fi
          echo "$(git rev-list --count "$GITHUB_SHA") commits reachable from $GITHUB_SHA: each is signed off and names no agent"

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: One-way imports (the @integraledger packages here depend on and import only @integraledger/lcp; the MCP server also on @integraledger/terms)
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const allowed = (name) =>
            name === "@integraledger/terms-mcp"
              ? ["@integraledger/lcp", "@integraledger/terms"]
              : ["@integraledger/lcp"];
          const code = /\.(?:[cm]?[jt]s|tsx)$/;
          const specifier = /(?:\bfrom|\bimport|\brequire\s*\()\s*\(?\s*["'](@integraledger\/[^"'/]+)/g;
          let packages = 0;
          let bad = 0;
          for (const dir of fs.readdirSync(".").sort()) {
            const manifest = path.join(dir, "package.json");
            // The documentation site is not a published package, and imports none of these.
            if (dir === "website" || !fs.existsSync(manifest)) continue;
            packages++;
            const pkg = JSON.parse(fs.readFileSync(manifest, "utf8"));
            const ok = new Set([pkg.name, ...allowed(pkg.name)]);
            const found = [];
            for (const field of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
              for (const name of Object.keys(pkg[field] ?? {})) {
                if (name.startsWith("@integraledger/")) found.push([name, `${manifest} ${field}`]);
              }
            }
            const walk = (d) => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                if (e.name === "node_modules" || e.name === "dist" || e.name.startsWith(".")) continue;
                const p = path.join(d, e.name);
                if (e.isDirectory()) walk(p);
                else if (code.test(e.name)) {
                  for (const m of fs.readFileSync(p, "utf8").matchAll(specifier)) found.push([m[1], p]);
                }
              }
            };
            walk(dir);
            for (const [name, where] of found) {
              if (!ok.has(name)) {
                console.log(`${where}: ${name}`);
                bad++;
              }
            }
          }
          if (packages === 0) {
            console.log("no package.json one level down: nothing was checked");
            process.exit(1);
          }
          if (bad > 0) process.exit(1);
          console.log(`${packages} package(s): no @integraledger dependency or import outside the allowed set`);
          EOF
      - name: Every job that runs a step fetches the Node.js .node-version names first, and checks it against one SHA-256, and every download retries five times
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const v = fs.readFileSync(".node-version", "utf8").trim();
          const bad = [];
          // Spelled in parts, so that this step's own lines do not hold what it looks for.
          const PATH_FILE = ["GITHUB", "PATH"].join("_");
          const ENV_FILE = ["GITHUB", "ENV"].join("_");
          // Every download retries a failed transfer five times, whatever the error, and writes one file.
          const FETCH = ["cu", "rl -fsSL --retry 5 --retry-all-errors"].join("");
          const fetchLine = new RegExp(`^ +${FETCH} -o "\\$RUNNER_TEMP/[^"\\s]+" https://[^\\s"'\`]+$`);
          if (process.version !== `v${v}`) bad.push(`node ${process.version} runs this step, where .node-version names ${v}`);
          const tarball = `node-v${v}-linux-x64.tar.xz`;
          const url = `https://nodejs.org/dist/v${v}/${tarball}`;
          const files = fs.readdirSync(".github/workflows").filter((f) => /\.ya?ml$/.test(f)).sort().map((f) => `.github/workflows/${f}`);
          const text = new Map(files.map((f) => [f, fs.readFileSync(f, "utf8").split("\n")]));
          const all = [...text.values()].flat();
          for (const u of all.join("\n").match(/https:\/\/nodejs\.org\/dist\/v[0-9][^\s"']*/g) ?? []) if (u !== url) bad.push(`a Node.js other than ${url}: ${u}`);
          const check = new RegExp(`^ +echo "([0-9a-f]{64})  \\$RUNNER_TEMP/${tarball.replaceAll(".", "\\.")}" \\| sha256sum -c -$`);
          const digests = [...new Set(all.map((l) => check.exec(l)?.[1]).filter(Boolean))];
          if (digests.length !== 1) bad.push(`${digests.length} SHA-256 digests for ${tarball}, where there is one`);
          // The one Fetch Node.js step, byte for byte, so that no key can be added to it.
          const step = [
            "      - name: Fetch Node.js",
            "        run: |",
            "          set -eu",
            `          ${FETCH} -o "$RUNNER_TEMP/${tarball}" ${url}`,
            `          echo "${digests[0]}  $RUNNER_TEMP/${tarball}" | sha256sum -c -`,
            '          mkdir "$RUNNER_TEMP/node"',
            `          tar -xJf "$RUNNER_TEMP/${tarball}" -C "$RUNNER_TEMP/node" --strip-components=1`,
            `          echo "$RUNNER_TEMP/node/bin" >> "$${PATH_FILE}"`,
          ];
          const paths = new Set([step[7], `          echo "$RUNNER_TEMP/pnpm" >> "$${PATH_FILE}"`]);
          const blank = (l) => /^\s*(#.*)?$/.test(l);
          let jobs = 0;
          for (const [f, lines] of text) {
            const at = (i) => `${f}:${i + 1}`;
            lines.forEach((l, i) => {
              // Nothing runs another Node.js or another shell, changes PATH or the environment of later steps, or lets a
              // step or a job be skipped or fail without failing the run.
              if (/setup-[n]ode|continue-on-[e]rror|^\s*(- )?(if|container|shell|PATH):/.test(l)) bad.push(`${at(i)}: ${l.trim()}`);
              if (l.includes(PATH_FILE) && !paths.has(l)) bad.push(`${at(i)}: a PATH entry other than the fetched Node.js and pnpm`);
              if (l.includes(ENV_FILE)) bad.push(`${at(i)}: a step sets the environment of the steps after it`);
              if (/\bcu[r]l\b/.test(l) && !fetchLine.test(l)) bad.push(`${at(i)}: a download other than ${FETCH} -o "$RUNNER_TEMP/<file>" https://<address>: ${l.trim()}`);
            });
            // These patterns read YAML's plain block style, so every workflow is written in it: outside a block scalar
            // (`run: |`), each line is blank, a comment, or one plain key and its value, and no value is a flow mapping
            // other than {}, a flow sequence of anything but plain words, an anchor, an alias, a tag, a quoted scalar
            // that does not close on its own line, or a block scalar whose header holds more than its indicators and a
            // comment. The jobs' steps are read only on the lines outside a block scalar.
            let scalar = -1;
            const held = new Set();
            lines.forEach((l, i) => {
              const indent = l.length - l.trimStart().length;
              if (scalar >= 0 && (l.trim() === "" || indent > scalar)) {
                held.add(i);
                return;
              }
              scalar = -1;
              if (blank(l)) return;
              const key = /^( *)(- )?[A-Za-z0-9_-]+:(?: +(.*))?$/.exec(l);
              const value = (key?.[3] ?? "").replace(/(^| +)#.*$/, "");
              const unclosed = /^['"]/.test(key?.[3] ?? "") && !/^('([^']|'')*'|"([^"\\]|\\.)*")( +#.*)?$/.test(key[3]);
              const header = /^[|>]/.test(value) && !/^[|>][-+1-9]*$/.test(value);
              if (key === null || unclosed || header || /^[&*!]/.test(value) || (value.startsWith("{") && value !== "{}") || (value.startsWith("[") && !/^\[[^\][{}:#"']*\]$/.test(value))) {
                bad.push(`${at(i)}: not one plain key and value: ${l.trim()}`);
              } else if (/^[|>][-+1-9]*$/.test(value)) scalar = key[1].length + (key[2] ? 2 : 0);
            });
            const start = lines.indexOf("jobs:");
            if (start < 0 || lines.lastIndexOf("jobs:") !== start) {
              bad.push(`${f}: no single line "jobs:"`);
              continue;
            }
            // Every line under jobs: is blank, a comment, a job's own line "  <name>:", or indented inside a job.
            const found = [];
            for (let i = start + 1; i < lines.length; i++) {
              if (blank(lines[i])) continue;
              if (/^  [A-Za-z0-9_-]+:$/.test(lines[i])) {
                if (found.length > 0) found.at(-1).to = i;
                found.push({ name: lines[i].trim().slice(0, -1), from: i + 1, to: lines.length });
              } else if (!/^    /.test(lines[i]) || found.length === 0) bad.push(`${at(i)}: neither a job's line "  <name>:" nor a line inside a job`);
            }
            if (found.length === 0) bad.push(`${f}: no job under "jobs:"`);
            for (const job of found) {
              const runs = [];
              for (let i = job.from; i < job.to; i++) if (!held.has(i) && /^ +(- )?run:/.test(lines[i])) runs.push(i);
              if (runs.length === 0) continue;
              jobs++;
              const fetches = [];
              for (let i = job.from; i < job.to; i++) if (!held.has(i) && step.every((s, k) => lines[i + k] === s)) fetches.push(i);
              let next = fetches[0] + step.length;
              while (next < job.to && blank(lines[next])) next++;
              if (fetches.length !== 1) bad.push(`${f}: job ${job.name} runs a step and holds the Fetch Node.js step ${fetches.length} times, where it holds it once`);
              else if (runs[0] !== fetches[0] + 1) bad.push(`${at(runs[0])}: job ${job.name} runs a step before it fetches Node.js`);
              else if (next < job.to && !lines[next].startsWith("      - ")) bad.push(`${at(next)}: job ${job.name}'s Fetch Node.js step carries a key it does not hold`);
            }
          }
          if (bad.length > 0) {
            console.log(`${bad.join("\n")}\nEvery job that runs a step holds, before its first other step that runs, the step:\n${step.join("\n")}`);
            process.exit(1);
          }
          console.log(`node ${process.version}: each of the ${jobs} jobs that runs a step fetches ${url} first and checks it against ${digests[0]}; every download is ${FETCH} -o "$RUNNER_TEMP/<file>" https://<address>`);
          JS
      - name: The install policy
        run: |
          set -eu
          grep -qx 'minimumReleaseAge: 1440' pnpm-workspace.yaml
          grep -qx 'trustPolicy: no-downgrade' pnpm-workspace.yaml
          grep -qx 'strictDepBuilds: true' pnpm-workspace.yaml
          echo "pnpm-workspace.yaml sets minimumReleaseAge 1440, trustPolicy no-downgrade and strictDepBuilds"
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm -r --if-present run typecheck
      - name: The tests, the shared vectors through the TypeScript gate among them
        run: pnpm -r --if-present run test
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.24
          enable-cache: false
      - name: The Python gate's tests, and the shared vectors through it, on Python 3.11
        working-directory: agentic-terms-py
        run: uv run --locked --python 3.11 pytest -q
      - name: The Python gate's tests, and the shared vectors through it, on Python 3.14
        working-directory: agentic-terms-py
        run: uv run --locked --python 3.14 pytest -q
      - name: The Python gate's types
        working-directory: agentic-terms-py
        run: uv run --locked --python 3.14 mypy --strict src tests

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.24
          enable-cache: false
      - name: Every sample in the READMEs and docs/, compiled and run against the packages built above, and the pairing tables against the registries
        run: node scripts/docs.mjs check

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: The packages, whose types the site's samples and API pages are checked against
        run: pnpm -r --if-present run build
      - name: The site's own install, from its own lockfile
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: The site, as the static export Cloudflare Pages serves (every TypeScript sample type-checked by Twoslash)
        working-directory: website
        run: pnpm run build
