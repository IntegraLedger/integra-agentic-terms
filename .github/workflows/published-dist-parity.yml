name: published-dist-parity

# ⛔⛔ SEPARATE FROM `published-parity.yml` DELIBERATELY, AND NOT BECAUSE OF TIDINESS. That workflow's own
# comment states its defining property — "No `cache: pnpm`: nothing is installed here, so there is nothing
# to cache." This gate REBUILDS each package to compare the published `dist/` against what its own source
# emits, so it needs an install and a build. Folding it in would quietly retire that property and make a
# registry-reading job depend on a toolchain, which is a different risk profile and should be visible as a
# different workflow rather than hidden inside an existing one.
#
# ⚠️ NOT IN `verify`, for the reason the sibling gate is not: it reaches a third party, and
# `check-hermetic-tests.mjs` states the consequence — "a gate that reaches a third party fails red for a
# reason that is not in the tree."
#
# ⛔⛔ AND THIS WORKFLOW IS NOW THE ONLY PLACE THE LIVE MEASUREMENT HAPPENS, which the sentence above always
# claimed and was not true. `scripts/check-published-dist-parity.test.mjs` carried a control that fetched
# the real tarballs from npmjs, and that drive runs inside `pnpm test:scripts` — stage 17 of `verify`. So
# the third-party fetch this header says is not in `verify` was in `verify`, and
# `hermetic-tests.declarations.json` asserted the opposite as a measurement while `check:hermetic-tests`
# stayed green. ⇒ The control moved HERE, where a red has somewhere to go: this job maps exit 2 onto a
# deduplicated, self-closing NOTHING-MEASURED issue, which is more than an assertion in a drive could do.
# ⚠️ The cost is stated rather than hidden: drift in a published `dist/` is now found within six hours
# instead of on the next `verify` — the same latency the sibling axis has always had.
#
# The minute is offset off the hour and off both siblings (:23 protocol, :37 terms parity, :53 chart). A
# published version is immutable, so an overlap could not make any of them ambiguous about what it saw;
# the offset is only to avoid queueing behind everything GitHub runs at :00.
on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:

# ⚠️ LEAST PRIVILEGE IS PER-JOB — a job-level block REPLACES this one rather than merging, so the job below
# states every scope it needs and this line only sets the default for a job that states none. `M` 2026-09-17
# this was the ONE workflow of eleven here with no top-level block: OpenSSF Scorecard reads the absence as
# the repository default (which can be write), not as the job's narrower grant, so the sibling's block is
# carried here for the same reason it carries it.
permissions:
  contents: read

concurrency:
  group: published-dist-parity
  cancel-in-progress: true

env:
  # ⛔ `gh` resolves its repository from the local checkout and does not read `GITHUB_REPOSITORY`; setting
  # `GH_REPO` keeps the reporting steps working even if the checkout is what failed.
  GH_REPO: ${{ github.repository }}
  DRIFT_TITLE: "published-dist-parity: the published dist/ is not what this source emits"
  UNMEASURED_TITLE: "published-dist-parity: nothing was compared, so there is no parity claim"
  FAULT_TITLE: "published-dist-parity: the check could not measure — instrument failure"

jobs:
  dist-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      # ⛔ The rebuild must use the toolchain this repository pins. `--frozen-lockfile` is the whole
      # reason a rebuild can be compared byte for byte at all: a floating TypeScript would emit different
      # output and the gate would report drift about a compiler rather than about an artifact.
      - run: pnpm install --frozen-lockfile

      - name: Rebuild each published version's dist and compare it to what shipped
        id: parity
        # ⛔⛔ THE EXIT CODE IS CAPTURED RATHER THAN ALLOWED TO FAIL THE STEP — this gate has four answers
        # and three of them are not "pass": 1 drift, 2 nothing compared, 3 the instrument failed, 4 a stale
        # floor. Letting the step fail collapses them into one red and the reporting below would file
        # "the published dist is wrong" over a run that measured nothing.
        #
        # ⚠️ `shell: bash` is not for pipefail — this step cannot fail. `PIPESTATUS` does not exist in `sh`,
        # which is what a bare `run:` may fall back to, and `PIPESTATUS[0]` is the whole mechanism.
        shell: bash
        run: |
          set +e
          node scripts/check-published-dist-parity.mjs 2>&1 | tee /tmp/dist-parity.log
          CODE=${PIPESTATUS[0]}
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "check:published-dist-parity exited $CODE"
          exit 0

      # ⛔⛔ `in:title` IS A WORD SEARCH, NOT AN EXACT TITLE MATCH, AND THE TWO PARITY WORKFLOWS IN THIS
      # REPOSITORY COLLIDE ON IT. `M` 2026-09-17, run against the live repository:
      #
      #     --search "published-parity: nothing was compared, so there is no parity claim in:title"
      #         -> #43  "published-dist-parity: nothing was compared, so there is no parity claim"
      #     --search "published-parity: a published version is behind the source it was cut from in:title"
      #         -> []                                            <- the control: the search is not matching everything
      #
      # ⇒ `published-parity` never opened its own NOTHING-MEASURED issue: every one of its reports since
      # 2026-09-16 landed as a comment on the SIBLING gate's issue, under a title naming the other gate.
      # ⛔ And the close loop below is the half that costs something: a run of one gate would have closed
      # the OTHER gate's open finding, on evidence about a different subject — the retraction this step's
      # own note forbids, arriving across workflows rather than across verdicts.
      #
      # ⇒ The search still narrows the set (it is the only server-side filter available), and the TITLE is
      # then compared for equality. ⚠️ The cost is that an issue whose title a human EDITS is no longer
      # found, and the next run opens a second one. That is the direction to fail in: a duplicate is
      # visible, and closing another gate's finding is not.
      #
      # ⛔ AND THE SAME COST FALLS ON US, NOT ONLY ON A HUMAN EDITOR: editing a title literal in this file's
      # `env:` block STRANDS whatever is open under the old title permanently. Nothing here will ever match
      # it again, so it is never commented on and never closed — a finding left open with no author. ⇒ A
      # title change is a change to two things, and the second one is an issue on the repository: close or
      # retitle the open one in the same change.
      #
      # ⚠️ `--limit 100` because `gh issue list` defaults to THIRTY. Equality over a truncated page is a
      # miss, and a miss here opens a duplicate rather than commenting — the failure would read as the gate
      # having nothing to say about an issue that is sitting open.
      #
      # ⭐ THE SUBJECT SET IS FOURTEEN SITES, NOT THE TEN IN THIS PAIR: `protocol-currency.yml` and
      # `protocol-latest.yml` carry the same close-and-file shape, two sites each, and were fixed in the
      # same change. Nothing collides between those two titles today — the defect there is latent, and it
      # goes live the day somebody files an issue whose title is a word superset of one of them.
      # ⛔ THE RUN CLOSES WHAT THE RUN OPENED. ⚠️ Only exit 0 closes: a 2, 3 or 4 means the question was not
      # answered, and closing a drift issue because the instrument broke retracts a finding on no evidence.
      - name: Close every issue this job opens, once parity is measured and holds
        if: steps.parity.outputs.code == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for TITLE in "$DRIFT_TITLE" "$UNMEASURED_TITLE" "$FAULT_TITLE"; do
            EXISTING=$(TITLE="$TITLE" gh issue list --state open --limit 100 --search "$TITLE in:title" --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
            [ -z "$EXISTING" ] && continue
            gh issue close "$EXISTING" --comment "$(printf 'Closed by the run that measured it: every published dist/ rebuilds byte for byte from the source it was cut from.\n\n[Run log](%s)\n' "$RUN_URL")"
          done

      - name: Open or update the DRIFT issue
        if: steps.parity.outputs.code == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(printf 'The `dist/` a consumer loads is not what this source emits. Files are named below as MISSING, as unexpected, or as DIFFERENT in content.\n\n⛔ A republish of the same version is not the remedy and is not possible: a version number is a promise about bytes. **The remedy is a version bump and a release.**\n\n⚠️ If the toolchain moved, this is still true — the published artifact no longer corresponds to its source. Republish; do not weaken the gate.\n\n[Run log](%s)\n\n```\n%s\n```\n' \
            "$RUN_URL" "$(cat /tmp/dist-parity.log)")
          EXISTING=$(TITLE="$DRIFT_TITLE" gh issue list --state open --limit 100 --search "$DRIFT_TITLE in:title" --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$DRIFT_TITLE" --body "$BODY"; fi

      - name: Open or update the NOTHING-MEASURED issue
        if: steps.parity.outputs.code == '2' || steps.parity.outputs.code == '4'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(printf 'This run compared fewer published `dist/` trees than the floor, or none at all. ⛔ That is not a pass: a tick here would be a statement about artifacts the run never opened.\n\n[Run log](%s)\n\n```\n%s\n```\n' \
            "$RUN_URL" "$(cat /tmp/dist-parity.log)")
          EXISTING=$(TITLE="$UNMEASURED_TITLE" gh issue list --state open --limit 100 --search "$UNMEASURED_TITLE in:title" --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$UNMEASURED_TITLE" --body "$BODY"; fi

      - name: Open or update the INSTRUMENT-FAILURE issue
        if: steps.parity.outputs.code == '3'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(printf 'The check could not measure. ⛔ This is NOT a product finding: the registry, a tarball or the rebuild failed, and nothing is being claimed about any published artifact.\n\n[Run log](%s)\n\n```\n%s\n```\n' \
            "$RUN_URL" "$(cat /tmp/dist-parity.log)")
          EXISTING=$(TITLE="$FAULT_TITLE" gh issue list --state open --limit 100 --search "$FAULT_TITLE in:title" --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$FAULT_TITLE" --body "$BODY"; fi

      - name: Report anything the five exits do not cover, or a step that broke before them
        # ⛔⛔ THE PARTITION ABOVE IS NOT EXHAUSTIVE OVER WHAT A PROCESS CAN EXIT. 127 (node missing), 137
        # (OOM) — a four-package rebuild is the job here that can reach one — or any code a future edit
        # adds would match none of the four conditions, and because the check step is deliberately
        # incapable of failing, `failure()` cannot backstop them either. ⇒ Without this step every one of
        # those is a GREEN, SILENT job over an artifact nothing opened, which is this gate's own subject
        # arriving one level up.
        #
        # ⚠️ `M` 2026-09-17: the sibling `published-parity.yml` has carried this step since it was written
        # and this workflow did not, so the same class was reported in one of the two and silent in the
        # other. ⛔ It has not fired here — it is written from the sibling's stated reason, not from an
        # observed run.
        if: always() && (failure() || !contains(fromJSON('["0","1","2","3","4"]'), steps.parity.outputs.code))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODE: ${{ steps.parity.outputs.code }}
        run: |
          LOG=$(cat /tmp/dist-parity.log 2>/dev/null || echo "(the check did not run — an earlier step failed; see the run log)")
          BODY=$(printf 'This job did not report the way it is written to, and the code below does not by itself say which way. The check exited `%s`. ⛔ Either that is a code this workflow has NO arm for — 127, 137, or one a future edit adds — or a step in this job FAILED, which includes the step that files the verdict: in that second case the code is ordinary and the finding it carries may have been recorded nowhere at all.\n\n⛔ Nothing here is a claim about any published artifact. It is a claim about this workflow.\n\n[Run log](%s)\n\n```\n%s\n```\n' \
            "${CODE:-<empty: the check never ran>}" "$RUN_URL" "$LOG")
          EXISTING=$(TITLE="$FAULT_TITLE" gh issue list --state open --limit 100 --search "$FAULT_TITLE in:title" --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$FAULT_TITLE" --body "$BODY"; fi
